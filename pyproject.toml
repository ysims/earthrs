[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "earthrs"
version = "0.1.0"
description = "Earth observation utilities built on the Python geospatial ecosystem."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "EarthRS contributors" }
]
keywords = ["remote-sensing", "earth-observation", "raster", "geospatial", "aquatic"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]
geo = [
  "xarray",
  "rasterio",
]

[project.urls]
Homepage = "https://github.com/ysims/earthrs"
Repository = "https://github.com/ysims/earthrs"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
